<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>(★) Queue Manager</title>
    
    <!-- IF YOU HAVE A dbConfig.js SCRIPT OR ANY SUPABASE KEYS HERE, KEEP THEM! -->
    
    <style>
        :root {
            --baby-blue: #e6f2ff;
            --dark-blue: #99c2ff;
            --baby-pink: #ffe6f2;
            --dark-pink: #ff99c2;
            --bg-color: #fff0f5;
            --text-color: #333;
        }
        
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            background-image: repeating-linear-gradient(45deg, #fff0f5 25%, #ffe6f2 25%, #ffe6f2 50%, #fff0f5 50%, #fff0f5 75%, #ffe6f2 75%, #ffe6f2 100%);
            background-size: 40px 40px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border: 2px solid var(--dark-blue);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 4px 4px 0px var(--baby-blue);
        }
        
        .header-panel {
            border: 2px solid var(--dark-pink);
            background: var(--baby-pink);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-box {
            background: white;
            border: 1px solid var(--dark-pink);
            border-radius: 5px;
            padding: 5px;
            font-size: 12px;
            font-weight: bold;
            color: var(--dark-pink);
        }
        
        .action-btn {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            font-family: inherit;
            font-weight: bold;
            border: 2px solid #ccc;
            border-radius: 5px;
            background: #fff;
            cursor: pointer;
        }
        
        .action-btn:active { transform: translateY(2px); }
        
        .slot {
            border: 2px dashed var(--dark-pink);
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #fff;
        }
        
        .slot-title {
            font-weight: bold;
            color: var(--dark-blue);
            text-align: center;
            margin-bottom: 10px;
            background: var(--baby-blue);
            padding: 8px;
            border-radius: 5px;
            border: 1px solid var(--dark-blue);
        }
        
        .caption-box {
            width: 100%;
            height: 70px;
            margin: 10px 0;
            font-family: inherit;
            border: 2px solid var(--dark-blue);
            border-radius: 5px;
            padding: 8px;
            box-sizing: border-box;
            resize: vertical;
        }
        
        .gallery-item img, .stash-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 2px solid var(--dark-blue);
            border-radius: 5px;
            cursor: pointer;
            margin: 2px;
        }
        
        .slot-gallery, .stash-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
            padding: 10px;
            background: var(--baby-pink);
            border-radius: 8px;
            border: 1px solid var(--dark-pink);
        }
        
        .stash-thumb-wrapper {
            position: relative;
        }
        
        .stash-tag-badge {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(255,255,255,0.9);
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 3px;
            border: 1px solid var(--dark-blue);
            color: var(--dark-blue);
            font-weight: bold;
        }
        
        .day-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 15px 0;
            font-size: 1.4em;
            font-weight: bold;
            color: var(--dark-blue);
        }
        
        .day-nav button {
            background: var(--baby-pink);
            border: 2px solid var(--dark-pink);
            font-weight: bold;
            padding: 5px 20px;
            cursor: pointer;
            font-size: 1em;
            border-radius: 5px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .modal-content {
            background: white;
            padding: 20px;
            border: 3px solid var(--dark-pink);
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 4px 4px 0px var(--dark-pink);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        #globalProgressContainer {
            display: none;
            width: 100%;
            height: 15px;
            background: #eee;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
            border: 1px solid #ccc;
        }
        
        #globalProgressBar {
            width: 0%;
            height: 100%;
            background: var(--dark-pink);
            transition: width 0.3s;
        }
        
        .section-title {
            text-align: center;
            color: var(--dark-pink);
            font-size: 1.5em;
            margin: 20px 0 10px 0;
            text-shadow: 1px 1px 0px white;
        }
        
        .file-input-wrapper {
            background: var(--baby-pink);
            border: 1px dashed var(--dark-pink);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body onload="initQueue()">

<div class="container">
    <!-- HEADER -->
    <div class="header-panel">
        <div class="top-bar">
            <h2 style="margin:0; color: var(--dark-pink);">(★) Manager</h2>
            <button class="action-btn" style="width: auto; margin: 0; padding: 5px 15px; border-color: var(--dark-blue); background: var(--baby-blue);" onclick="openSettings()">(★) Schedule</button>
        </div>
        <div class="status-box" id="cloudStatus">WAITING FOR INIT...</div>
        <div class="status-box" id="headerCounters">Stashed: 0 | Slots Filled: 0 / 0</div>
        
        <div id="globalProgressContainer">
            <div id="globalProgressBar"></div>
        </div>
    </div>

    <!-- DAY NAVIGATION -->
    <div class="day-nav">
        <button onclick="changeDay(-1)">◄</button>
        <span id="dayDisplay">Day 1</span>
        <button onclick="changeDay(1)">►</button>
    </div>

    <!-- SCHEDULED POSTS -->
    <h2 class="section-title">(★) Scheduled</h2>
    <div id="scheduled-container" style="border: 2px solid var(--baby-blue); padding: 15px; border-radius: 10px; background: white;">
        <!-- Slots load here automatically -->
    </div>

    <!-- CLEANED UP GLOBAL BUTTONS: Only the Clear button remains -->
    <button class="action-btn" style="margin-top: 15px; border-color: red; color: red; font-weight: bold;" onclick="clearAllSlots()">( x _ x ) Clear All Slots</button>

    <hr style="border: 1px dashed var(--dark-pink); margin: 30px 0;">

    <!-- STASH MANAGER -->
    <h2 class="section-title">(★) Stash</h2>
    <div style="border: 2px solid var(--baby-blue); padding: 15px; border-radius: 10px; background: white;">
        
        <div class="file-input-wrapper">
            <input type="file" id="stashFileSelect" multiple accept="image/*,image/gif" onchange="previewSelectedFiles(event)">
            <div id="uploadStatusText" style="font-size: 12px; margin-top: 5px; color: #666;">No files selected.</div>
        </div>

        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <select id="uploadTagSelect" style="flex: 1; padding: 8px; border-radius: 5px; border: 1px solid var(--dark-blue);"></select>
            <input type="text" id="newUploadTagInput" placeholder="...or type new tag" style="flex: 1; padding: 8px; border-radius: 5px; border: 1px solid var(--dark-blue);">
        </div>
        
        <button class="action-btn" style="background: var(--baby-pink); border-color: var(--dark-pink);" onclick="uploadAndSaveTag()">(★) Upload to Stash</button>
        
        <hr style="border: 1px solid #eee; margin: 15px 0;">
        
        <select id="stashFilter" onchange="updateStashFilter()" style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 5px; border: 2px solid var(--dark-blue);">
            <option value="All">View All Tags</option>
        </select>
        
        <div id="stashWarning" style="display:none; color: red; font-weight: bold; font-size: 12px; text-align: center; margin-bottom: 5px;">WARNING: Stash is getting full! (15+ items)</div>
        
        <div class="stash-grid" id="stashPreview">
            <!-- Stash items load here automatically -->
        </div>

        <hr style="border: 1px solid #eee; margin: 15px 0;">
        
        <div style="display: flex; gap: 5px; align-items: center;">
            <input type="number" id="autoFillAmount" value="3" min="1" max="12" style="width: 60px; padding: 8px; border-radius: 5px; border: 1px solid var(--dark-blue);">
            <button class="action-btn" style="margin: 0; background: var(--baby-pink); border-color: var(--dark-pink);" onclick="autoFillDayCustom()">(ﾉ◕ヮ◕)ﾉ Auto-Slot Empty</button>
        </div>
    </div>

</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3 style="color: var(--dark-blue); text-align: center; margin-top:0;">(★) Schedule Settings</h3>
        <p style="font-size: 12px; color: #666; text-align: center;">Set your daily posting times.</p>
        
        <div id="scheduleInputsContainer" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;"></div>
        
        <button class="action-btn" style="background: var(--baby-blue); border-color: var(--dark-blue);" onclick="addTimeInput()">+ Add Time</button>
        <button class="action-btn" style="background: var(--baby-pink); border-color: var(--dark-pink);" onclick="saveAndCloseSettings()">✓ Save Settings</button>
        <button class="action-btn" onclick="document.getElementById('settingsModal').style.display='none'">Cancel</button>

        <hr style="border: 1px dashed red; margin: 20px 0;">
        <button class="action-btn" style="border-color: red; color: red; font-weight: bold;" onclick="localStorage.removeItem('upstashConfig'); alert('Upstash keys cleared. Refresh page.');">( x _ x ) Reset Upstash Keys</button>
    </div>
</div>

<!-- STASH ACTION MODAL -->
<div id="stashActionModal" class="modal">
    <div class="modal-content">
        <h3 style="color: var(--dark-pink); text-align: center; margin-top:0;">Move to Day <span id="modalDayDisplay"></span></h3>
        
        <div id="stashActionSlotButtons"></div>
        
        <hr style="border: 1px dashed red; margin: 15px 0;">
        <button class="action-btn" style="background: #ffe6e6; border-color: red; color: red;" onclick="executeStashDelete()">( x _ x ) Delete Permanently</button>
        <button class="action-btn" onclick="closeStashActionModal()">Cancel</button>
    </div>
</div>

<script src="queue.js"></script>
</body>
</html>
