<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Queue Manager ★</title>
    <style>
        /* 2000s Baby Pink & Blue Aesthetic */
        :root {
            --baby-pink: #ffb6c1;
            --hot-pink: #ff69b4;
            --baby-blue: #add8e6;
            --dark-blue: #4682b4;
            --bg-color: #fff0f5; 
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: repeating-linear-gradient(
                45deg,
                #fff0f5,
                #fff0f5 10px,
                #ffe4e1 10px,
                #ffe4e1 20px
            );
            font-family: 'Verdana', sans-serif;
            color: #333;
            margin: 0;
            padding: 15px;
            padding-bottom: 50px;
        }

        h1, h2 {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: var(--hot-pink);
            text-shadow: 2px 2px var(--baby-blue);
            text-align: center;
        }

        /* Top Navigation / Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--baby-pink);
            border: 3px outset var(--hot-pink);
            padding: 10px 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            text-shadow: 1px 1px white;
        }

        .settings-btn {
            background: var(--baby-blue);
            border: 2px outset var(--dark-blue);
            padding: 8px 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Verdana', sans-serif;
            color: #000;
        }
        
        .settings-btn:active { border-style: inset; }

        /* Modal Settings */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 240, 245, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: white;
            border: 4px dashed var(--baby-blue);
            padding: 20px;
            width: 100%;
            max-width: 350px;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 5px 5px 15px rgba(255, 105, 180, 0.3);
            border-radius: 15px;
        }

        .time-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .modal-content input[type="time"] {
            padding: 8px;
            border: 2px inset var(--baby-pink);
            font-family: 'Verdana', sans-serif;
            border-radius: 5px;
            width: 150px;
        }

        .remove-btn {
            background: #ff9999;
            border: 2px outset #cc0000;
            color: white;
            font-weight: bold;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 5px;
        }
        .remove-btn:active { border-style: inset; }

        .add-time-btn {
            background: var(--baby-pink);
            border: 2px outset var(--hot-pink);
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .add-time-btn:active { border-style: inset; }

        /* Content Stash Drawer */
        .stash-drawer {
            background: white;
            border: 3px solid var(--baby-blue);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 3px 3px 0px var(--baby-pink);
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .stash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--hot-pink);
            font-family: 'Comic Sans MS', sans-serif;
        }

        .stash-preview-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            min-height: 90px;
            align-items: center;
            border: 2px dashed var(--baby-pink);
            background: #fdfdfd;
            padding: 10px;
            border-radius: 5px;
        }

        .stash-thumb {
            width: 70px;
            height: 70px;
            border-radius: 5px;
            object-fit: cover;
            border: 2px outset var(--baby-blue);
            flex-shrink: 0;
            cursor: pointer;
        }

        .stash-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .stash-btn {
            flex: 1;
            background: var(--baby-blue);
            border: 2px outset var(--dark-blue);
            color: #000;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }
        .stash-btn:active { border-style: inset; }

        /* Layout for Posts */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .grid-container { grid-template-columns: 1fr; }
        }

        .section {
            background: white;
            border: 3px solid var(--baby-blue);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 3px 3px 0px var(--baby-pink);
        }

        /* Individual Slots */
        .slot {
            background: #fdfdfd;
            border: 2px dashed var(--baby-pink);
            margin-bottom: 15px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
        }

        .slot-title {
            font-weight: bold;
            color: var(--dark-blue);
            margin-bottom: 10px;
            font-size: 14px;
            background: #f0f8ff;
            padding: 5px;
            border: 1px solid var(--baby-blue);
            border-radius: 4px;
        }

        .image-preview {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border: 2px inset #ccc;
            margin: 10px 0;
            display: none;
            background: #eee;
        }

        /* File Input & Buttons */
        input[type="file"] {
            font-size: 11px;
            margin-bottom: 10px;
            width: 100%;
            background: var(--bg-color);
            padding: 5px;
            border: 1px dashed var(--baby-blue);
        }

        .btn-group {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 5px;
        }

        .action-btn {
            background: var(--baby-pink);
            border: 2px outset var(--hot-pink);
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            font-size: 14px;
        }

        .action-btn:active { border-style: inset; }
        
        .action-btn.clear {
            background: #fff;
            border: 2px outset #ccc;
            color: #666;
            font-size: 12px;
            padding: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>★ My Dashboard ★</h1>
        <button class="settings-btn" onclick="openSettings()">⚙️ Edit Schedule</button>
    </div>

    <!-- Content Stash -->
    <div class="stash-drawer">
        <div class="stash-header">
            <span>★ Content Stash</span>
            <span id="stashCount" style="font-size: 12px; color: #666;">0 items</span>
        </div>
        <div class="stash-preview-container" id="stashPreview">
            <span style="font-size: 12px; color: #aaa;">Dump photos here to use later...</span>
        </div>
        <div class="stash-actions">
            <label class="stash-btn">
                + Dump Photos
                <input type="file" multiple accept="image/*" style="display: none;" onchange="uploadToStash(event)">
            </label>
            <button class="stash-btn" onclick="autoFillDay()" style="background: var(--baby-pink); border-color: var(--hot-pink);">✨ Auto-Slot</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <h2>Your Schedule</h2>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Build your exact daily routine below.</p>
            
            <div id="scheduleInputsContainer">
                <!-- Inputs injected here by JS -->
            </div>
            
            <button class="add-time-btn" onclick="addTimeInput()">+ Add Another Post Time</button>
            <button class="settings-btn" style="width: 100%; margin-top: 10px;" onclick="saveAndCloseSettings()">Save & Close</button>
        </div>
    </div>

    <div class="grid-container">
        <!-- Scheduled Column -->
        <div class="section">
            <h2>★ Daily Schedule ★</h2>
            <div id="scheduled-container">
                <!-- Scheduled slots injected here by JS -->
            </div>
        </div>

        <!-- Random/Whenever Column -->
        <div class="section">
            <h2>★ Spontaneous ★</h2>
            <div id="random-container">
                <!-- Random slots injected here by JS -->
            </div>
            <button class="add-time-btn" onclick="addRandomSlot()">+ Add Extra Random Slot</button>
        </div>
    </div>

    <script>
        // Core Data
        let scheduleTimes = JSON.parse(localStorage.getItem('myCustomSchedule')) || ['09:00', '13:00', '18:00', '22:00'];
        let randomSlotCount = 3; 
        let photoStash = []; // Holds object URLs for the current session

        window.onload = function() {
            renderApp();
        };

        // --- CORE RENDER ENGINE ---
        function renderApp() {
            scheduleTimes.sort();

            const schedContainer = document.getElementById('scheduled-container');
            schedContainer.innerHTML = '';
            
            if(scheduleTimes.length === 0) {
                schedContainer.innerHTML = '<p style="text-align:center; font-size:12px; color:#666;">No scheduled posts. Open settings to add some!</p>';
            }

            scheduleTimes.forEach((time24h, index) => {
                const timeFormatted = formatTime12h(time24h);
                schedContainer.innerHTML += createSlotHTML(`sched-${index}`, `Post ${index + 1} - ${timeFormatted}`);
            });

            const randomContainer = document.getElementById('random-container');
            randomContainer.innerHTML = '';
            for(let i = 0; i < randomSlotCount; i++) {
                randomContainer.innerHTML += createSlotHTML(`rand-${i}`, `Spontaneous Post`);
            }
        }

        function createSlotHTML(id, title) {
            return `
                <div class="slot" id="slot-${id}">
                    <div class="slot-title">${title}</div>
                    <input type="file" accept="image/*" onchange="loadImage(event, '${id}')">
                    <img id="preview-${id}" class="image-preview">
                    <div class="btn-group" id="btnGroup-${id}">
                        <button class="action-btn" onclick="copyToClipboard('preview-${id}')">📋 Copy Image</button>
                        <button class="action-btn clear" onclick="clearSlot('${id}', this)">❌ Clear Slot</button>
                    </div>
                </div>
            `;
        }

        function formatTime12h(time24h) {
            let [hours, minutes] = time24h.split(':');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            return `${hours}:${minutes} ${ampm}`;
        }

        // --- STASH & AUTO-FILL LOGIC ---
        function uploadToStash(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                // Keep original quality in local memory
                photoStash.push(URL.createObjectURL(file)); 
            });
            renderStash();
        }

        function renderStash() {
            document.getElementById('stashCount').innerText = `${photoStash.length} items`;
            const previewContainer = document.getElementById('stashPreview');
            
            if (photoStash.length === 0) {
                previewContainer.innerHTML = '<span style="font-size: 12px; color: #aaa;">Dump photos here to use later...</span>';
                return;
            }

            previewContainer.innerHTML = photoStash.map((url, index) => 
                `<img src="${url}" class="stash-thumb" onclick="removeFromStash(${index})" title="Click to remove">`
            ).join('');
        }

        function removeFromStash(index) {
            URL.revokeObjectURL(photoStash[index]); // Free up browser memory
            photoStash.splice(index, 1);
            renderStash();
        }

        function autoFillDay() {
            // Find all slots in the Daily Schedule container
            const schedContainer = document.getElementById('scheduled-container');
            const slots = schedContainer.querySelectorAll('.slot');

            slots.forEach(slot => {
                const img = slot.querySelector('.image-preview');
                // If the slot is empty and we have photos in the stash
                if ((!img.src || img.style.display === 'none') && photoStash.length > 0) {
                    const nextPhotoUrl = photoStash.shift(); // Pull from stash
                    
                    img.src = nextPhotoUrl;
                    img.style.display = 'block';
                    slot.querySelector('.btn-group').style.display = 'flex';
                    slot.querySelector('input[type="file"]').value = ""; // Reset input just in case
                }
            });
            renderStash();
        }

        // --- SETTINGS MODAL LOGIC ---
        function openSettings() {
            const container = document.getElementById('scheduleInputsContainer');
            container.innerHTML = '';
            scheduleTimes.forEach((time, index) => {
                container.innerHTML += `
                    <div class="time-row" id="time-row-${index}">
                        <input type="time" class="time-input" value="${time}">
                        <button class="remove-btn" onclick="removeTimeInput(${index})">X</button>
                    </div>
                `;
            });
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function addTimeInput() {
            const container = document.getElementById('scheduleInputsContainer');
            const newIndex = container.children.length;
            const div = document.createElement('div');
            div.className = 'time-row';
            div.id = `time-row-${newIndex}`;
            div.innerHTML = `
                <input type="time" class="time-input" value="12:00">
                <button class="remove-btn" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(div);
        }

        function removeTimeInput(index) {
            document.getElementById(`time-row-${index}`).remove();
        }

        function saveAndCloseSettings() {
            const inputs = document.querySelectorAll('.time-input');
            let newTimes = [];
            inputs.forEach(input => {
                if(input.value) newTimes.push(input.value);
            });
            
            scheduleTimes = newTimes;
            localStorage.setItem('myCustomSchedule', JSON.stringify(scheduleTimes));
            
            document.getElementById('settingsModal').style.display = 'none';
            renderApp();
        }

        function addRandomSlot() {
            randomSlotCount++;
            const randomContainer = document.getElementById('random-container');
            const newId = `rand-${randomSlotCount - 1}`;
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = createSlotHTML(newId, `Spontaneous Post`);
            randomContainer.appendChild(tempDiv.firstElementChild);
        }

        // --- IMAGE & CLIPBOARD LOGIC ---
        function loadImage(event, id) {
            const file = event.target.files[0];
            if (file) {
                const imgElement = document.getElementById(`preview-${id}`);
                imgElement.src = URL.createObjectURL(file);
                imgElement.style.display = 'block';
                
                const btnGroup = document.getElementById(`btnGroup-${id}`);
                btnGroup.style.display = 'flex';
            }
        }

        function clearSlot(id, btnElement) {
            const imgElement = document.getElementById(`preview-${id}`);
            imgElement.src = "";
            imgElement.style.display = 'none';
            
            const btnGroup = document.getElementById(`btnGroup-${id}`);
            btnGroup.style.display = 'none';
            
            const fileInput = btnElement.parentElement.parentElement.querySelector('input[type="file"]');
            if (fileInput) fileInput.value = "";
        }

        async function copyToClipboard(previewId) {
            const imgElement = document.getElementById(previewId);
            try {
                const response = await fetch(imgElement.src);
                const blob = await response.blob();
                
                await navigator.clipboard.write([
                    new ClipboardItem({
                        [blob.type]: blob
                    })
                ]);
                alert("Copied! Paste directly into the OF app.");
            } catch (err) {
                console.error("Clipboard error:", err);
                alert("Failed to copy. Your browser might restrict clipboard access here.");
            }
        }
    </script>
</body>
</html>
