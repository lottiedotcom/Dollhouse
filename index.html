<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Queue Manager (★^O^★)</title>
    
    <!-- App Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.jpg">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffb6c1">

    <style>
        /* 2000s Baby Pink & Blue Aesthetic */
        :root {
            --baby-pink: #ffb6c1;
            --hot-pink: #ff69b4;
            --baby-blue: #add8e6;
            --dark-blue: #4682b4;
            --bg-color: #fff0f5; 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            background-image: repeating-linear-gradient(45deg, #fff0f5, #fff0f5 10px, #ffe4e1 10px, #ffe4e1 20px);
            font-family: 'Verdana', sans-serif;
            color: #333;
            margin: 0;
            padding: 15px;
            padding-bottom: 50px;
        }

        h1, h2 {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: var(--hot-pink);
            text-shadow: 2px 2px var(--baby-blue);
            text-align: center;
        }

        /* Modals (Supabase & Settings) */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 240, 245, 0.9); z-index: 1000;
            justify-content: center; align-items: center; padding: 15px;
        }

        .modal-content {
            background: white; border: 4px dashed var(--baby-blue); padding: 20px;
            width: 100%; max-width: 350px; max-height: 90vh; overflow-y: auto;
            text-align: center; box-shadow: 5px 5px 15px rgba(255, 105, 180, 0.3);
            border-radius: 15px;
        }

        .input-field {
            width: 100%; padding: 10px; margin-bottom: 15px;
            border: 2px inset var(--baby-pink); border-radius: 5px;
            font-family: 'Verdana', sans-serif; background: #f0f8ff;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--baby-pink); border: 3px outset var(--hot-pink);
            padding: 10px 15px; margin-bottom: 10px; border-radius: 10px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .header h1 { margin: 0; font-size: 20px; text-shadow: 1px 1px white; }

        .btn-style {
            background: var(--baby-blue); border: 2px outset var(--dark-blue);
            padding: 8px 12px; font-weight: bold; cursor: pointer;
            border-radius: 5px; font-family: 'Verdana', sans-serif; color: #000;
        }
        .btn-style:active { border-style: inset; }

        #cloudStatus {
            text-align: center; font-size: 11px; color: var(--dark-blue);
            font-weight: bold; margin-bottom: 15px; text-transform: uppercase;
        }

        /* Stash Drawer */
        .stash-drawer {
            background: white; border: 3px solid var(--baby-blue); border-radius: 10px;
            padding: 15px; margin-bottom: 20px; box-shadow: 3px 3px 0px var(--baby-pink);
            max-width: 900px; margin-left: auto; margin-right: auto;
        }
        
        .stash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; color: var(--hot-pink); font-family: 'Comic Sans MS', sans-serif; }
        
        .stash-preview-container {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;
            min-height: 90px; align-items: center; border: 2px dashed var(--baby-pink);
            background: #fdfdfd; padding: 10px; border-radius: 5px;
        }

        .stash-thumb {
            width: 70px; height: 70px; border-radius: 5px; object-fit: cover;
            border: 2px outset var(--baby-blue); flex-shrink: 0; cursor: pointer;
        }

        .stash-actions { display: flex; gap: 10px; margin-top: 10px; }

        /* Grid & Sections */
        .grid-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            max-width: 900px; margin: 0 auto;
        }
        @media (max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }

        .section {
            background: white; border: 3px solid var(--baby-blue);
            padding: 15px; border-radius: 10px; box-shadow: 3px 3px 0px var(--baby-pink);
        }

        /* Slots */
        .slot {
            background: #fdfdfd; border: 2px dashed var(--baby-pink);
            margin-bottom: 15px; padding: 15px; text-align: center; border-radius: 8px;
        }

        .slot-title {
            font-weight: bold; color: var(--dark-blue); margin-bottom: 10px;
            font-size: 14px; background: #f0f8ff; padding: 5px;
            border: 1px solid var(--baby-blue); border-radius: 4px;
        }

        .slot-gallery {
            display: flex; gap: 10px; overflow-x: auto; padding: 10px 5px;
            background: #fff0f5; border: 2px inset var(--baby-pink);
            border-radius: 5px; margin: 10px 0; align-items: flex-start;
        }

        .gallery-item img {
            width: 100px; height: 100px; object-fit: cover;
            border: 2px solid var(--baby-blue); border-radius: 5px; flex-shrink: 0;
        }

        input[type="file"] {
            font-size: 11px; margin-bottom: 10px; width: 100%;
            background: var(--bg-color); padding: 5px; border: 1px dashed var(--baby-blue);
        }

        textarea.caption-box {
            width: 100%; height: 60px; border: 2px inset var(--baby-blue);
            border-radius: 5px; padding: 8px; font-family: 'Verdana', sans-serif;
            font-size: 12px; resize: none; margin-bottom: 10px;
            background: #f0f8ff; color: #333;
        }

        .action-btn {
            background: var(--baby-pink); border: 2px outset var(--hot-pink);
            padding: 10px; font-weight: bold; cursor: pointer;
            border-radius: 5px; width: 100%; font-size: 14px; margin-top: 5px;
        }
        .action-btn:active { border-style: inset; }
        
        .action-btn.posted { background: var(--baby-blue); border-color: var(--dark-blue); }
        .action-btn.clear { background: #fff; border: 2px outset #ccc; color: #666; font-size: 12px; padding: 8px; }

        .time-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; }
        .remove-btn { background: #ff9999; border: 2px outset #cc0000; color: white; font-weight: bold; cursor: pointer; padding: 6px 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- Cloud Vault Setup Modal -->
    <div id="dbModal" class="modal-overlay">
        <div class="modal-content">
            <h2>(★) Vault Setup (★)</h2>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Connect your secure Supabase Vault to save high-res files.</p>
            <input type="text" id="dbUrl" class="input-field" placeholder="Supabase Project URL" />
            <input type="password" id="dbKey" class="input-field" placeholder="Supabase Service Role Key" />
            <button class="btn-style" style="width: 100%; background: var(--baby-pink); border-color: var(--hot-pink);" onclick="connectDatabase()">Connect & Sync</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <h2>Your Schedule</h2>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Build your exact daily routine below.</p>
            <div id="scheduleInputsContainer"></div>
            <button class="btn-style" style="width: 100%; margin: 15px 0; background: var(--baby-pink);" onclick="addTimeInput()">+ Add Time</button>
            <button class="btn-style" style="width: 100%;" onclick="saveAndCloseSettings()">Save & Close</button>
        </div>
    </div>

    <div class="header">
        <h1>(★) Queue Manager</h1>
        <button class="btn-style" onclick="openSettings()">(★) Schedule</button>
    </div>

    <div id="cloudStatus">Checking connection...</div>

    <div id="appInterface" style="display: none;">
        
        <!-- Content Stash -->
        <div class="stash-drawer">
            <div class="stash-header">
                <span>(★) Content Stash</span>
                <span id="stashCount" style="font-size: 12px; color: #666;">0 items</span>
            </div>
            <div class="stash-preview-container" id="stashPreview">
                <span style="font-size: 12px; color: #aaa;">Dump photos here to use later...</span>
            </div>
            <div class="stash-actions">
                <label class="btn-style" style="flex: 1; text-align: center;">
                    + Dump Photos
                    <input type="file" multiple accept="image/*" style="display: none;" onchange="uploadToStash(event)">
                </label>
                <button class="btn-style" onclick="autoFillDay()" style="flex: 1; background: var(--baby-pink); border-color: var(--hot-pink);">(ﾉ◕ヮ◕)ﾉ Auto-Slot</button>
            </div>
        </div>

        <div class="grid-container">
            <!-- Scheduled Column -->
            <div class="section">
                <h2>(★) Daily Schedule</h2>
                <div id="scheduled-container"></div>
            </div>

            <!-- Random Column -->
            <div class="section">
                <h2>(★) Spontaneous</h2>
                <div id="random-container"></div>
                <button class="btn-style" style="width: 100%; margin-top: 15px;" onclick="addRandomSlot()">+ Add Random Slot</button>
            </div>
        </div>
        
        <!-- Clear All Button -->
        <div style="text-align: center; margin-top: 30px;">
            <button class="btn-style clear" style="width: 100%; max-width: 400px; padding: 15px; background: #fff; border: 3px outset #ccc; color: #cc0000; font-weight: bold;" onclick="clearAllSlots()">( ✖ _ ✖ ) Clear All Slots</button>
        </div>
    </div>

    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // Supabase Vault Credentials
        let dbConfig = { url: '', key: '' };
        
        let appData = {
            schedule: ['09:00', '13:00', '18:00', '22:00'],
            randomSlotCount: 3,
            stash: [],
            slots: {}
        };

        // Fallback for older image states
        let loadedImages = {};

        // Helper to normalize image records & get thumbnails
        function getImageInfo(item) {
            if (!item) return { vaultKey: '', originalName: '', thumb: '' };
            if (typeof item === 'object' && item.vaultKey) {
                let name = item.originalName || item.vaultKey;
                name = name.replace(/^QUEUE_DUMP_[^_]*_?/, '');
                return { vaultKey: item.vaultKey, originalName: name, thumb: item.thumb || '' };
            }
            let vaultKey = item;
            let originalName = item;
            if (item.includes('___')) {
                originalName = item.split('___').slice(1).join('___');
            } else {
                originalName = item.replace(/^\d+_/, '');
            }
            originalName = originalName.replace(/^QUEUE_DUMP_[^_]*_?/, '');
            return { vaultKey, originalName, thumb: '' };
        }

        // --- SUPABASE CLOUD SYNC ---
        function init() {
            const savedConfig = localStorage.getItem('supabaseConfig');
            if (savedConfig) {
                dbConfig = JSON.parse(savedConfig);
                fetchCloudData();
            } else {
                document.getElementById('dbModal').style.display = 'flex';
                document.getElementById('cloudStatus').innerText = "AWAITING CREDENTIALS...";
            }
        }

        function connectDatabase() {
            dbConfig.url = document.getElementById('dbUrl').value.trim();
            dbConfig.key = document.getElementById('dbKey').value.trim();
            if (!dbConfig.url || !dbConfig.key) return alert("Requires both URL and Key");
            
            localStorage.setItem('supabaseConfig', JSON.stringify(dbConfig));
            document.getElementById('dbModal').style.display = 'none';
            fetchCloudData();
        }

        async function fetchCloudData() {
            document.getElementById('cloudStatus').innerText = "SYNCING WITH VAULT...";
            try {
                const response = await fetch(`${dbConfig.url}/storage/v1/object/public/vault/state.json`, {
                    headers: { 'apikey': dbConfig.key, 'Authorization': `Bearer ${dbConfig.key}` }
                });
                
                if (response.ok) {
                    const json = await response.json();
                    appData = { ...appData, ...json };
                }

                document.getElementById('cloudStatus').innerText = "(★) VAULT SYNCED & SECURE";
                document.getElementById('appInterface').style.display = 'block';
                
                await preloadMissingThumbnails();
                renderApp();

            } catch (err) {
                document.getElementById('cloudStatus').innerText = "CONNECTION ERROR. CHECK CREDENTIALS.";
                localStorage.removeItem('supabaseConfig');
                document.getElementById('dbModal').style.display = 'flex';
            }
        }

        async function saveToCloudImmediate() {
            document.getElementById('cloudStatus').innerText = "SAVING TO VAULT...";
            try {
                const blob = new Blob([JSON.stringify(appData)], { type: 'application/json' });
                await fetch(`${dbConfig.url}/storage/v1/object/vault/state.json`, {
                    method: 'POST',
                    headers: { 
                        'apikey': dbConfig.key, 
                        'Authorization': `Bearer ${dbConfig.key}`,
                        'Content-Type': 'application/json',
                        'x-upsert': 'true'
                    },
                    body: blob
                });
                document.getElementById('cloudStatus').innerText = "(★) ALL CHANGES SAVED";
            } catch (err) {
                document.getElementById('cloudStatus').innerText = "SAVE FAILED. RETRYING...";
            }
        }

        // --- RAW FILE HANDLING ---
        async function uploadFileToVault(file) {
            document.getElementById('cloudStatus').innerText = "UPLOADING HIGH-RES FILE...";
            
            let originalName = file.name.replace(/^QUEUE_DUMP_[^_]*_?/, '');
            const vaultKey = `${Date.now()}___${originalName.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
            
            // Create a lightweight base64 thumbnail for instant UI loading
            const thumbBase64 = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 150; // Keeps the string super small
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
            
            // Push the massive file to the cloud silently
            await fetch(`${dbConfig.url}/storage/v1/object/vault/${vaultKey}`, {
                method: 'POST',
                headers: { 
                    'apikey': dbConfig.key, 
                    'Authorization': `Bearer ${dbConfig.key}`,
                    'Content-Type': file.type
                },
                body: file
            });

            document.getElementById('cloudStatus').innerText = "(★) VAULT SYNCED & SECURE";
            
            // Save the thumb directly to the state so we never have to fetch the blob again just to view it
            return { vaultKey: vaultKey, originalName: originalName, thumb: thumbBase64 };
        }

        // Backwards compatibility: Only download massive blobs for older photos that don't have built-in thumbnails
        async function preloadMissingThumbnails() {
            let filesToFetch = [...appData.stash];
            Object.values(appData.slots).forEach(slot => {
                if (slot.images) filesToFetch.push(...slot.images);
            });

            for (let item of filesToFetch) {
                const info = getImageInfo(item);
                if (info.vaultKey && !info.thumb && !loadedImages[info.vaultKey]) {
                    try {
                        const response = await fetch(`${dbConfig.url}/storage/v1/object/vault/${info.vaultKey}`, {
                            headers: { 'apikey': dbConfig.key, 'Authorization': `Bearer ${dbConfig.key}` }
                        });
                        if (response.ok) {
                            const blob = await response.blob();
                            loadedImages[info.vaultKey] = URL.createObjectURL(blob);
                        }
                    } catch (e) {
                        console.error("Failed to load older image:", info.vaultKey);
                    }
                }
            }
        }

        // --- CORE UI RENDER ---
        function renderApp() {
            appData.schedule.sort();
            const schedContainer = document.getElementById('scheduled-container');
            const randContainer = document.getElementById('random-container');
            
            schedContainer.innerHTML = '';
            appData.schedule.forEach((time, index) => {
                const id = `sched-${index}`;
                schedContainer.innerHTML += createSlotHTML(id, `Post ${index + 1} - ${formatTime(time)}`);
                hydrateSlotUI(id);
            });

            randContainer.innerHTML = '';
            for(let i = 0; i < appData.randomSlotCount; i++) {
                const id = `rand-${i}`;
                randContainer.innerHTML += createSlotHTML(id, `Spontaneous Post`);
                hydrateSlotUI(id);
            }

            renderStash();
        }

        function createSlotHTML(id, title) {
            return `
                <div class="slot" id="slot-${id}">
                    <div class="slot-title">${title}</div>
                    <input type="file" multiple accept="image/*" onchange="uploadToSlot(event, '${id}')">
                    
                    <div class="slot-gallery" id="gallery-${id}" style="display: none;"></div>
                    
                    <textarea class="caption-box" id="caption-${id}" placeholder="Type your caption here... (Auto-saves)" oninput="updateCaption('${id}', this.value)"></textarea>
                    
                    <div id="btnGroup-${id}" style="display: none; flex-direction: column; gap: 5px;">
                        <button class="action-btn" onclick="prepForPost('${id}')">(ﾉ◕ヮ◕)ﾉ Copy Photos & Caption to Keyboard</button>
                        <button class="action-btn posted" onclick="markAsPosted('${id}')">(★) Mark Posted (Auto-Archive)</button>
                        <button class="action-btn clear" onclick="clearSlot('${id}')">[X] Clear Slot</button>
                    </div>
                </div>
            `;
        }

        function hydrateSlotUI(id) {
            if(!appData.slots[id]) return;
            const data = appData.slots[id];
            
            document.getElementById(`caption-${id}`).value = data.caption || "";
            
            const gallery = document.getElementById(`gallery-${id}`);
            const btnGroup = document.getElementById(`btnGroup-${id}`);
            
            if (data.images && data.images.length > 0) {
                gallery.innerHTML = data.images.map(item => {
                    const info = getImageInfo(item);
                    // Use lightweight thumb if it exists, otherwise use fallback blob
                    const url = info.thumb || loadedImages[info.vaultKey] || '';
                    return `<div class="gallery-item"><img src="${url}"></div>`;
                }).join('');
                gallery.style.display = 'flex';
                btnGroup.style.display = 'flex';
            } else if (data.caption) {
                gallery.style.display = 'none';
                btnGroup.style.display = 'flex';
            } else {
                gallery.style.display = 'none';
                btnGroup.style.display = 'none';
            }
        }

        function formatTime(time24h) {
            let [hours, minutes] = time24h.split(':');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12; 
            return `${hours}:${minutes} ${ampm}`;
        }

        // --- DATA HANDLING ---
        async function uploadToSlot(event, id) {
            const files = Array.from(event.target.files);
            if (!appData.slots[id]) appData.slots[id] = { caption: "", images: [] };
            
            for (let file of files) {
                const imgObj = await uploadFileToVault(file);
                appData.slots[id].images.push(imgObj);
            }
            
            hydrateSlotUI(id);
            await saveToCloudImmediate();
            event.target.value = ""; 
        }

        function updateCaption(id, text) {
            if (!appData.slots[id]) appData.slots[id] = { caption: "", images: [] };
            appData.slots[id].caption = text;
            saveToCloudImmediate();
            hydrateSlotUI(id);
        }

        async function clearSlot(id) {
            appData.slots[id] = { caption: "", images: [] };
            hydrateSlotUI(id);
            await saveToCloudImmediate();
        }

        async function clearAllSlots() {
            if(confirm("Are you sure you want to clear ALL scheduled slots? (This won't delete the actual photos from your Vault).")) {
                document.getElementById('cloudStatus').innerText = "CLEARING ALL SLOTS...";
                
                Object.keys(appData.slots).forEach(id => {
                    appData.slots[id] = { caption: "", images: [] };
                });
                
                renderApp();
                await saveToCloudImmediate();
                document.getElementById('cloudStatus').innerText = "(★) ALL SLOTS CLEARED";
            }
        }

        // --- STASH & AUTO-FILL ---
        async function uploadToStash(event) {
            const files = Array.from(event.target.files);
            for (let file of files) {
                const imgObj = await uploadFileToVault(file);
                appData.stash.push(imgObj);
                renderStash();
            }
            await saveToCloudImmediate();
            event.target.value = "";
        }

        function renderStash() {
            document.getElementById('stashCount').innerText = `${appData.stash.length} items`;
            const previewContainer = document.getElementById('stashPreview');
            
            if (appData.stash.length === 0) {
                previewContainer.innerHTML = '<span style="font-size: 12px; color: #aaa;">Dump photos here to use later...</span>';
                return;
            }

            previewContainer.innerHTML = appData.stash.map((item, index) => {
                const info = getImageInfo(item);
                const url = info.thumb || loadedImages[info.vaultKey] || '';
                return `<img src="${url}" class="stash-thumb" onclick="removeFromStash(${index})" title="Click to remove">`;
            }).join('');
        }

        async function removeFromStash(index) {
            appData.stash.splice(index, 1);
            renderStash();
            await saveToCloudImmediate();
        }

        async function autoFillDay() {
            const schedContainer = document.getElementById('scheduled-container');
            const slots = Array.from(schedContainer.querySelectorAll('.slot'));

            if (slots.length === 0 || appData.stash.length === 0) return alert("Check if you have slots and stash items!");

            let slotIndex = 0;
            while (appData.stash.length > 0) {
                const item = appData.stash.shift(); 
                const targetSlot = slots[slotIndex];
                const id = targetSlot.id.replace('slot-', '');
                
                if (!appData.slots[id]) appData.slots[id] = { caption: "", images: [] };
                appData.slots[id].images.push(item);
                
                slotIndex = (slotIndex + 1) % slots.length;
            }
            
            renderApp();
            await saveToCloudImmediate();
        }

        // --- PREP POST (CLIPBOARD ENGINE) ---
        async function prepForPost(id) {
            const data = appData.slots[id];
            if (!data) return;

            let copiedCount = 0;
            document.getElementById('cloudStatus').innerText = "COPYING TO KEYBOARD...";

            if (data.caption) {
                try {
                    await navigator.clipboard.writeText(data.caption);
                    await new Promise(resolve => setTimeout(resolve, 500)); 
                } catch (err) {
                    console.error("Caption copy failed", err);
                }
            }

            if (data.images && data.images.length > 0) {
                for (let item of data.images) {
                    try {
                        const info = getImageInfo(item);

                        // Only download the massive high-res file when you actually need to post it
                        const response = await fetch(`${dbConfig.url}/storage/v1/object/vault/${info.vaultKey}`, {
                            headers: { 'apikey': dbConfig.key, 'Authorization': `Bearer ${dbConfig.key}` }
                        });
                        
                        if (response.ok) {
                            const blob = await response.blob();
                            
                            const img = new Image();
                            const url = window.URL.createObjectURL(blob);
                            
                            await new Promise((resolve, reject) => {
                                img.onload = resolve;
                                img.onerror = reject;
                                img.src = url;
                            });

                            const canvas = document.createElement('canvas');
                            
                            // Safety Limit: Prevents mobile RAM from crashing when drawing massive raw photos
                            const MAX_COPY_WIDTH = 2500; 
                            let finalWidth = img.width;
                            let finalHeight = img.height;
                            
                            if (finalWidth > MAX_COPY_WIDTH) {
                                const ratio = MAX_COPY_WIDTH / finalWidth;
                                finalWidth = MAX_COPY_WIDTH;
                                finalHeight = img.height * ratio;
                            }

                            canvas.width = finalWidth;
                            canvas.height = finalHeight;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, finalWidth, finalHeight);

                            const pngBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                            
                            await navigator.clipboard.write([
                                new ClipboardItem({
                                    'image/png': pngBlob
                                })
                            ]);
                            
                            copiedCount++;
                            window.URL.revokeObjectURL(url);
                            
                            await new Promise(resolve => setTimeout(resolve, 600)); 
                        }
                    } catch (e) {
                        console.error("Clipboard copy failed for:", item, e);
                    }
                }
                
                document.getElementById('cloudStatus').innerText = "(★) VAULT SYNCED & SECURE";
                alert(`Caption and ${copiedCount} photo(s) copied to your keyboard clipboard! (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧`);
            } else if (data.caption) {
                document.getElementById('cloudStatus').innerText = "(★) VAULT SYNCED & SECURE";
                alert("Caption copied to your keyboard! (No photos in this slot)");
            }
        }

        async function markAsPosted(id) {
            const data = appData.slots[id];
            if (!data || !data.images) return await clearSlot(id);

            document.getElementById('cloudStatus').innerText = "ARCHIVING POSTED FILES...";

            for (let item of data.images) {
                const info = getImageInfo(item);
                try {
                    await fetch(`${dbConfig.url}/storage/v1/object/move`, {
                        method: 'POST',
                        headers: {
                            'apikey': dbConfig.key,
                            'Authorization': `Bearer ${dbConfig.key}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            bucketId: 'vault',
                            sourceKey: info.vaultKey,
                            destinationKey: `posted/${info.vaultKey}`
                        })
                    });
                } catch (err) {
                    console.error("Failed to move file in cloud:", info.vaultKey);
                }
            }

            await clearSlot(id);
            alert("moved to posted folder & cleared (★^O^★)");
        }

        // --- SETTINGS MODAL LOGIC ---
        function openSettings() {
            const container = document.getElementById('scheduleInputsContainer');
            container.innerHTML = '';
            appData.schedule.forEach((time, index) => {
                container.innerHTML += `
                    <div class="time-row" id="time-row-${index}">
                        <input type="time" class="input-field" style="margin:0; width:150px;" value="${time}">
                        <button class="remove-btn" onclick="this.parentElement.remove()">X</button>
                    </div>
                `;
            });
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function addTimeInput() {
            const container = document.getElementById('scheduleInputsContainer');
            const div = document.createElement('div');
            div.className = 'time-row';
            div.innerHTML = `
                <input type="time" class="input-field" style="margin:0; width:150px;" value="12:00">
                <button class="remove-btn" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(div);
        }

        async function saveAndCloseSettings() {
            const inputs = document.querySelectorAll('#scheduleInputsContainer input[type="time"]');
            let newTimes = [];
            inputs.forEach(input => { if(input.value) newTimes.push(input.value); });
            
            appData.schedule = newTimes;
            document.getElementById('settingsModal').style.display = 'none';
            renderApp();
            await saveToCloudImmediate();
        }

        async function addRandomSlot() {
            appData.randomSlotCount++;
            renderApp();
            await saveToCloudImmediate();
        }

        init();
    </script>
</body>
</html>
